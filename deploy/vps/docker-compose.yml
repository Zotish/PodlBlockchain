x-podl-logging: &podl-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

services:
  chain:
    image: ${LQD_IMAGE:-podl-blockchain:local}
    restart: unless-stopped
    logging: *podl-logging
    working_dir: /app
    command: sh scripts/railway/start-chain.sh
    env_file:
      - .env
    environment:
      PORT: "6500"
      P2P_PORT: "${P2P_PORT:-6100}"
      LQD_DATA_DIR: /app/data
      LQD_BRIDGE_DATA_DIR: /app/data
      CHAIN_DB_PATH: /app/data/chain/evodb
      BRIDGE_STATE_FILE: /app/data/bridge_relayer_state.json
    volumes:
      - ./data:/app/data
    ports:
      - "${CHAIN_HTTP_BIND:-127.0.0.1:6500}:6500"
      - "${P2P_BIND:-0.0.0.0:6100}:6100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6500/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s

  wallet:
    image: ${LQD_IMAGE:-podl-blockchain:local}
    restart: unless-stopped
    logging: *podl-logging
    working_dir: /app
    command: sh scripts/railway/start-wallet.sh
    env_file:
      - .env
    environment:
      PORT: "8080"
      CHAIN_URL: http://chain:6500
    depends_on:
      - chain
    ports:
      - "${WALLET_HTTP_BIND:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s

  aggregator:
    image: ${LQD_IMAGE:-podl-blockchain:local}
    restart: unless-stopped
    logging: *podl-logging
    working_dir: /app
    command: sh scripts/railway/start-aggregator.sh
    env_file:
      - .env
    environment:
      PORT: "9000"
      CHAIN_URL: http://chain:6500
      WALLET_URL: http://wallet:8080
      AGGREGATOR_NODES: "${AGGREGATOR_NODES:-auto}"
    depends_on:
      - chain
      - wallet
    ports:
      - "${AGG_HTTP_BIND:-127.0.0.1:9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s

  dex-api:
    image: node:20-bookworm-slim
    restart: unless-stopped
    logging: *podl-logging
    working_dir: /srv
    command: sh -c "npm ci --omit=dev && npm start"
    env_file:
      - .env
    environment:
      PORT: "9100"
      DEX_REGISTRY_DB: /data/dex-registry.sqlite
      LQD_NODE_URL: http://chain:6500
      LQD_WALLET_URL: http://wallet:8080
      ALLOWED_ORIGINS: "${LQD_ALLOWED_ORIGINS:-*}"
    volumes:
      - ./app/swap-dex/server/package.json:/srv/package.json:ro
      - ./app/swap-dex/server/package-lock.json:/srv/package-lock.json:ro
      - ./app/swap-dex/server/index.js:/srv/index.js:ro
      - dex_api_node_modules:/srv/node_modules
      - ./data/dex-api:/data
    depends_on:
      chain:
        condition: service_healthy
      wallet:
        condition: service_started
    ports:
      - "${DEX_API_HTTP_BIND:-127.0.0.1:9100}:9100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 35s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *podl-logging
    profiles:
      - proxy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chain
      - wallet
      - aggregator
      - dex-api

volumes:
  caddy_data:
  caddy_config:
  dex_api_node_modules:
