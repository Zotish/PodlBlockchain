name: Deploy Backend To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: podl-vps-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Export image tag
        id: meta
        run: echo "image=${{ steps.image.outputs.name }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/podl}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH' '$DEPLOY_PATH/systemd'"
          scp deploy/vps/docker-compose.yml deploy/vps/Caddyfile deploy/vps/.env.example "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          scp deploy/vps/systemd/* "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/systemd/"

      - name: Pull image and restart services
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          LQD_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/podl}"
          ssh "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' LQD_IMAGE='$LQD_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created $DEPLOY_PATH/.env. Fill it on the server, then re-run this workflow."
            exit 1
          fi

          export LQD_IMAGE
          export COMPOSE_PROFILES=""
          if grep -q '^ENABLE_CADDY=true' .env; then
            export COMPOSE_PROFILES="proxy"
          fi

          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans
          docker image prune -f
          docker compose -f docker-compose.yml ps
          REMOTE
