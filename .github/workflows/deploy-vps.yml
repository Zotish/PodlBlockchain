name: Deploy Backend To VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configure_validator_signer:
        description: "Migrate the existing validator key into the encrypted mTLS signer"
        required: false
        default: false
        type: boolean

concurrency:
  group: podl-vps-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Export image tag
        id: meta
        run: echo "image=${{ steps.image.outputs.name }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose files
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/podl}"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH' '$DEPLOY_PATH/systemd'"
          scp deploy/vps/docker-compose.yml deploy/vps/Caddyfile deploy/vps/.env.example "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          scp deploy/vps/systemd/* "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/systemd/"
          scp scripts/ops/podl_snapshot.sh scripts/ops/podl_image_deploy.sh scripts/ops/podl_setup_validator_signer.sh "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Pull image and restart services
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          LQD_IMAGE: ${{ needs.build.outputs.image }}
          CONFIGURE_VALIDATOR_SIGNER: ${{ inputs.configure_validator_signer || false }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/podl}"
          if [ "$CONFIGURE_VALIDATOR_SIGNER" = "true" ]; then
            ssh "$VPS_USER@$VPS_HOST" "PODL_ROOT='$DEPLOY_PATH' LQD_IMAGE='$LQD_IMAGE' sh '$DEPLOY_PATH/podl_setup_validator_signer.sh'"
          fi
          ssh "$VPS_USER@$VPS_HOST" "PODL_ROOT='$DEPLOY_PATH' LQD_IMAGE='$LQD_IMAGE' sh '$DEPLOY_PATH/podl_image_deploy.sh'"
          ssh "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && docker compose -f docker-compose.yml ps"
